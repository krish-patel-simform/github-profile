<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Github</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="main-container">

        <!-- header -->
        <header class="header">

            <!-- header Left -->
            <nav class="header__left">
                <span>
                    <svg>
                        <use href="./icons.svg#logo"></use>
                    </svg>
                </span>
                <ul class="header__left-list">
                    <li> <a href="#">Why Github?</a> </li>
                    <li> <a href="#">Team</a> </li>
                    <li> <a href="#">Enterprise</a> </li>
                    <li> <a href="#">Explore</a> </li>
                    <li> <a href="#">Marketplace</a> </li>
                    <li> <a href="#">Pricing</a> </li>
                </ul>
            </nav>

            <!-- header right -->
            <div class="header__right">
                <search>
                    <input type="search" name="search" placeholder="Search"/>
                </search>
                <button>Sign in</button>
                <button>Sign up</button>
            </div> 
        </header>

        <!-- main -->
        <main class="main">

            <!-- profile navigation -->
            <div class="main__navigation-container">
                <!-- hidden div -->
                <div class="main__hidden-div"></div>
                <!--  -->
                <nav class="main__navigation">
                    <ul>
                        <li> <a>Overview</a> </li>
                        <li> <a>Repositories</a> </li>
                        <li> <a>Projects</a> </li>
                        <li> <a>Packages</a> </li>

                    </ul>
                </nav>
            </div>

            <!-- profile  -->
            <section class="profile-container">
                <!-- profile photos and all -->
                <aside class="profile-container__profile">
                    
                    <!-- image -->
                    <span>
                        <img />
                    </span>

                    <h1> Krish Patel </h1>
                    <h6>Profile</h6>

                </aside>

                <!-- repos -->
                <section class="profile-container__repos"></section>
            </section>

        </main>

        <!-- footer -->

    </div>
</body>

</html>
